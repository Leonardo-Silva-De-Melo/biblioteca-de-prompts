# =============================================================================
# BIBLIOTECA DE PROMPTS API — configuracao Spring Boot
# =============================================================================
# Todos os valores abaixo vem de variaveis de ambiente. Rodando pelo
# docker-compose, elas sao injetadas a partir do arquivo .env (ver .env.example).
#
# Rodando a API fora do Docker, exporte ao menos DB_PASSWORD e OLLAMA_BASE_URL
# antes de iniciar — nao ha senha nem endereco padrao, de proposito.
# =============================================================================
spring.application.name=biblioteca-prompts-api

# =============================================================================
# BANCO DE DADOS — PostgreSQL
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bibliotecapromptsdb}
spring.datasource.username=${DB_USERNAME:biblioteca_prompts}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =============================================================================
# KEYCLOAK — Resource Server (validacao de JWT)
# =============================================================================
# O issuer-uri precisa ser identico ao endereco pelo qual o NAVEGADOR obtem o
# token. Divergencia aqui rejeita todas as requisicoes com "invalid issuer".
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/biblioteca-prompts}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:8180/realms/biblioteca-prompts/protocol/openid-connect/certs}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:biblioteca-prompts-frontend}

# =============================================================================
# SERVIDOR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# CORS
# =============================================================================
# Origens autorizadas a chamar a API, separadas por virgula. Em producao, liste
# apenas os dominios reais do frontend — nunca "*" com allow-credentials ativo.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

# =============================================================================
# OLLAMA — motor de inferencia
# =============================================================================
# Endereco do Ollama que tem os modelos baixados. Exemplos:
#   Ollama na maquina host, API no Docker:  http://host.docker.internal:11434
#   Ollama em outro servidor da rede:       http://SEU_SERVIDOR:11434
#   Ollama como container desta stack:      http://biblioteca-prompts-ollama:11434
ollama.url=${OLLAMA_BASE_URL}
ollama.model=${OLLAMA_MODEL:llama3.2:latest}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2:latest}

# =============================================================================
# UPLOAD DE ARQUIVOS — limite alinhado com o do frontend
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
