server {
    listen 80;

    # Serve um discovery document personalizado com URLs separadas:
    # - authorization_endpoint: localhost:8180 (para o BROWSER do usuário)
    # - token_endpoint e userinfo: biblioteca-prompts-keycloak:8080 (para o Open WebUI, via rede Docker)
    location = /realms/biblioteca-prompts/.well-known/openid-configuration {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"issuer":"http://localhost:8180/realms/biblioteca-prompts","authorization_endpoint":"http://localhost:8180/realms/biblioteca-prompts/protocol/openid-connect/auth","token_endpoint":"http://biblioteca-prompts-keycloak:8080/realms/biblioteca-prompts/protocol/openid-connect/token","introspection_endpoint":"http://biblioteca-prompts-keycloak:8080/realms/biblioteca-prompts/protocol/openid-connect/token/introspect","userinfo_endpoint":"http://biblioteca-prompts-keycloak:8080/realms/biblioteca-prompts/protocol/openid-connect/userinfo","end_session_endpoint":"http://localhost:8180/realms/biblioteca-prompts/protocol/openid-connect/logout","jwks_uri":"http://biblioteca-prompts-keycloak:8080/realms/biblioteca-prompts/protocol/openid-connect/certs","grant_types_supported":["authorization_code","implicit","refresh_token","password","client_credentials"],"response_types_supported":["code","none","id_token","token","id_token token","code id_token","code token","code id_token token"],"subject_types_supported":["public","pairwise"],"id_token_signing_alg_values_supported":["RS256","ES256","PS256"],"userinfo_signing_alg_values_supported":["RS256","ES256","none"],"token_endpoint_auth_methods_supported":["private_key_jwt","client_secret_basic","client_secret_post","client_secret_jwt"],"claims_supported":["iss","sub","aud","exp","iat","auth_time","name","given_name","family_name","preferred_username","email","acr","azp","nonce","roles"],"scopes_supported":["openid","offline_access","profile","email","phone","address","roles"],"request_parameter_supported":true,"request_uri_parameter_supported":true,"code_challenge_methods_supported":["S256","plain"]}';
    }
}
